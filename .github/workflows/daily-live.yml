name: Daily live radar

on:
  schedule:
    - cron: '20 */3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'collectors/watchlist.json'
      - 'scripts/generate-live.cjs'
      - 'scripts/lib/live-collect.cjs'
      - 'scripts/lib/live-compose.cjs'
      - 'scripts/lib/live-render.cjs'
      - 'scripts/lib/translate.cjs'
      - 'locales/glossary.json'
      - 'locales/live-chrome.json'
      - '.github/workflows/daily-live.yml'

permissions:
  contents: write

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install OpenCC
        run: pip install opencc-python-reimplemented
      - name: Collect public sources and write live briefing
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/generate-live.cjs
      - name: Publish live pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/live public/index.html public/en/index.html public/zh-Hant/index.html public/ja/index.html public/ko/index.html public/es/index.html public/fr/index.html public/de/index.html public/ar/index.html
          if git diff --cached --quiet; then
            echo "No live radar changes"
            exit 0
          fi
          git commit -m "更新 $(date -u +%F) 自动雷达"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git push
