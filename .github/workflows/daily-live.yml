name: Daily live radar

on:
  schedule:
    - cron: '20 0,12 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'collectors/watchlist.json'
      - 'scripts/generate-live.cjs'
      - 'scripts/lib/live-collect.cjs'
      - 'scripts/lib/live-compose.cjs'
      - 'scripts/lib/live-render.cjs'
      - '.github/workflows/daily-live.yml'

permissions:
  contents: write

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Collect public sources and write live briefing
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/generate-live.cjs
      - name: Publish live pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/live
          if git diff --cached --quiet; then
            echo "No live radar changes"
            exit 0
          fi
          git commit -m "更新 $(date -u +%F) 自动雷达"
          git push
