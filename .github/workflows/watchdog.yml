name: Daily watchdog

on:
  schedule:
    - cron: '30 15 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-today:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Shanghai daily issue
        run: node scripts/check-today.cjs --deadline-hour 22
