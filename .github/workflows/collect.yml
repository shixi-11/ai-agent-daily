name: Collect signals

on:
  schedule:
    - cron: '20 1,5,9,13 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Collect GitHub / Hugging Face / RSS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/collect-signals.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: agent-daily-signals
          path: collectors/out/
          if-no-files-found: error
          retention-days: 14
