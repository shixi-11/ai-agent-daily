name: Collect signals

on:
  schedule:
    # 07:20, 13:20, 17:20 and 21:20 Asia/Shanghai. The first run feeds the 08:00 Daily.
    - cron: '20 23 * * *'
    - cron: '20 5,9,13 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify collector health, retry and concurrency behavior
        run: node --test scripts/collect-signals.test.cjs scripts/prepare-editorial-snapshot.test.cjs
      - name: Collect GitHub / Hugging Face / RSS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/collect-signals.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: agent-daily-signals
          path: collectors/out/
          if-no-files-found: error
          retention-days: 14
